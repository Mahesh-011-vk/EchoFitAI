name: Create GitHub Release

on:
  push:
    tags:
      - 'v*' # Trigger when a tag starting with v is pushed, e.g. v1.0.0

permissions:
  contents: write # Required to create/update releases and upload assets

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Unsigned Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Stage Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/EchoFit-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/EchoFit-release-unsigned.apk

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/EchoFit-debug.apk
            release-artifacts/EchoFit-release-unsigned.apk
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            ## EchoFit Release ${{ github.ref_name }} 🚀
            
            This automated release compiles the latest mobile application builds:
            * **`EchoFit-debug.apk`**: Pre-signed with a debug key, ready to download and install immediately for testing on emulators and devices.
            * **`EchoFit-release-unsigned.apk`**: Production release build (unsigned). Needs to be signed with a production keystore before deployment to the Play Store.
            
            *Automatically generated by GitHub Actions.*
          token: ${{ secrets.GITHUB_TOKEN }}
